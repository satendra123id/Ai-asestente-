<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRindia Advanced AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <header class="terminal-header">
            <h1>> THE_NEW_TIPS_SYSTEM <span class="blink">_</span></h1>
            <p class="status">Status: <span class="online">ONLINE</span> | Root Access: Granted</p>
        </header>
        
        <main id="chat-box" class="chat-box">
            <div class="bot msg">> System Initialized. How can I help you today?</div>
        </main>
        
        <div class="input-area">
            <button id="mic-btn" class="icon-btn" title="Voice Command">🎤</button>
            <input type="text" id="user-input" placeholder="> Enter command..." autocomplete="off">
            <button id="send-btn" class="action-btn">EXECUTE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
